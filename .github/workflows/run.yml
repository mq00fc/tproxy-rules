name: Run All

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

# 与原工作流保持同一个并发组，避免新旧任务同时写入。
concurrency:
  group: run-all
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-rules:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    steps:
      - name: 检出代码
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: 下载、生成并校验全部规则
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Python 3 和 curl 已由 GitHub 托管的 ubuntu-latest 提供。
          # 无需安装额外依赖；所有规则校验成功后才写入工作区。
          python3 - <<'PY'
          import base64
          import ipaddress
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import tempfile

          AD_URL = "https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/AWAvenue-Ads-Rule.txt"
          GFW_URL = "https://raw.githubusercontent.com/gfwlist/gfwlist/master/gfwlist.txt"
          TG_URL = "https://core.telegram.org/resources/cidr.txt"
          META_BASE = "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/refs/heads/sing/geo/geoip"
          GH_URL = "https://api.github.com/meta"
          META_NAMES = ("cloudflare", "google", "facebook", "cloudfront", "netflix", "private")
          LABEL_RE = re.compile(r"[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?", re.ASCII)
          IPV4_LIKE = re.compile(r"[0-9]+(?:\.[0-9]+){3}")
          OUTPUTS = (
              "adblock-plus.txt", "proxy-list.txt", "direct-gfw.txt",
              "mihomo/ad.list", "mihomo/proxy.list", "mihomo/direct.list",
              "mihomo/cf-cidr.list", "mihomo/github-cidr.list",
              "nft-base-ips4.sh", "nft-base-ips6.sh",
          )

          def fetch(url, target, *, github_api=False):
              print(f"下载: {url}", flush=True)
              cmd = [
                  "curl", "--fail", "--silent", "--show-error", "--location",
                  "--retry", "4", "--retry-all-errors", "--retry-delay", "3",
                  "--retry-max-time", "180", "--connect-timeout", "15",
                  "--max-time", "90", "--user-agent", "tproxy-rules/automation",
                  "--output", str(target),
              ]
              if github_api:
                  cmd += ["--header", "Accept: application/vnd.github+json"]
                  token = os.environ.get("GH_TOKEN", "")
                  if token:
                      cmd += ["--header", f"Authorization: Bearer {token}"]
              cmd += [url]
              # 不打印 cmd，避免在错误日志中暴露认证头。
              result = subprocess.run(cmd, check=False)
              if result.returncode != 0:
                  raise RuntimeError(f"下载失败: {url} (curl exit {result.returncode})")
              if not target.is_file() or target.stat().st_size == 0:
                  raise ValueError(f"上游文件为空: {url}")
              print(f"下载成功: {target.stat().st_size} bytes", flush=True)
              return target

          def read_text(path):
              return path.read_text(encoding="utf-8-sig")

          def valid_host(host):
              # 清除 FQDN 末尾的根标签，统一大小写和 IDN 表示。
              host = host.removesuffix(".")
              if not host or any(c.isspace() for c in host):
                  return None
              try:
                  host = host.encode("idna").decode("ascii").lower()
              except UnicodeError:
                  return None
              if len(host) > 253 or IPV4_LIKE.fullmatch(host):
                  return None
              try:
                  ipaddress.ip_address(host)
              except ValueError:
                  pass
              else:
                  return None
              if not all(LABEL_RE.fullmatch(label) for label in host.split(".")):
                  return None
              return host

          def convert_domains(text, *, ad=False):
              # 同一份上游数据同时生成 MosDNS 和 Mihomo，避免不同步。
              result = {"proxy": (set(), set()), "direct": (set(), set())}
              for raw in text.splitlines():
                  line = raw.strip()
                  if not line or line.startswith(("!", "#", ";", "[")):
                      continue
                  direct = line.startswith("@@")
                  if ad and line.startswith("@"):
                      continue
                  if direct:
                      line = line[2:]
                  if not line or line.startswith("/") or "*" in line:
                      continue
                  # 延续原来的 AdGuard 策略：不转换 URL / 路径规则。
                  if ad and "/" in line:
                      continue

                  suffix = False
                  if line.startswith("||"):
                      line = line[2:]
                      suffix = True
                  elif line.startswith(("|http://", "|https://")):
                      line = line.split("://", 1)[1]
                  elif line.startswith("."):
                      line = line[1:]
                      suffix = True
                  else:
                      line = line.lstrip("|")

                  # 延续原来的 GFWList 策略：去除路径及 Adblock 修饰符。
                  host = re.split(r"[/$^]", line, maxsplit=1)[0].removesuffix("|")
                  host = valid_host(host)
                  if not host:
                      continue
                  mos, mihomo = result["direct" if direct else "proxy"]
                  if "." not in host:
                      # 保留原有 MosDNS 单标签写法，不生成 keyword/regexp。
                      if suffix:
                          mos.add("." + host)
                      continue

                  # AdGuard 的 MosDNS 输出沿用无前缀格式；GFW 完整匹配用 full:。
                  mos.add(host if ad or suffix else "full:" + host)
                  mihomo.add(("DOMAIN-SUFFIX," if suffix else "DOMAIN,") + host)
              return result

          def checked_networks(values, source):
              if not isinstance(values, list) or not values:
                  raise ValueError(f"{source}: CIDR 列表为空或格式不正确")
              result = {4: set(), 6: set()}
              for item in values:
                  if not isinstance(item, str) or not item.strip() or "%" in item:
                      raise ValueError(f"{source}: 非法 CIDR: {item!r}")
                  try:
                      # strict=False 归一化带主机位的网段，裸 IP 转 /32 或 /128。
                      network = ipaddress.ip_network(item.strip(), strict=False)
                  except ValueError as exc:
                      raise ValueError(f"{source}: 非法 CIDR: {item!r}") from exc
                  # 防止异常上游数据使所有流量都命中代理/私网集合。
                  if network.prefixlen == 0:
                      raise ValueError(f"{source}: 拒绝默认路由网段 {network}")
                  result[network.version].add(network)
              print(f"{source}: IPv4={len(result[4])}, IPv6={len(result[6])}", flush=True)
              return result

          def meta_networks(path, source):
              data = json.loads(read_text(path))
              rules = data.get("rules") if isinstance(data, dict) else None
              if not isinstance(rules, list) or not rules:
                  raise ValueError(f"{source}: rules 缺失或格式错误")
              values = []
              for rule in rules:
                  if not isinstance(rule, dict):
                      raise ValueError(f"{source}: 非法 rules 项")
                  cidrs = rule.get("ip_cidr")
                  # 有些 rule 没有 ip_cidr，正常跳过；其他错误类型则拒绝。
                  if cidrs is None:
                      continue
                  if not isinstance(cidrs, list):
                      raise ValueError(f"{source}: ip_cidr 必须是数组")
                  values.extend(cidrs)
              return checked_networks(values, source)

          def require_lines(lines, filename):
              ordered = sorted(set(lines))
              if not ordered:
                  raise ValueError(f"{filename}: 生成结果为空，取消本次发布")
              print(f"{filename}: {len(ordered)} 条", flush=True)
              return "\n".join(ordered) + "\n"

          def mihomo_cidrs(networks, filename):
              return require_lines((
                  f"{'IP-CIDR' if version == 4 else 'IP-CIDR6'},{network},no-resolve"
                  for version in (4, 6) for network in networks[version]
              ), filename)

          def merged(networks):
              return list(ipaddress.collapse_addresses(networks))

          def nft_script(private, public, *, ipv6):
              # 不 flush 现有集合，以免删除运行中的动态/自定义地址。
              # 一次 nft 事务提交，避免前半段成功、后半段失败。
              lines = ["#!/bin/sh", "set -eu", "", "# Generated automatically; do not edit.",
                       "nft -f - <<'NFT_RULES'"]
              versions = (4, 6) if ipv6 else (4,)
              for version in versions:
                  suffix = "6" if version == 6 else ""
                  for name, group in (("private_ips" + suffix, private), ("ips" + suffix, public)):
                      addresses = merged(group[version])
                      if not addresses:
                          continue
                      if any(network.prefixlen == 0 for network in addresses):
                          raise ValueError(f"{name}: 合并后出现默认路由，取消发布")
                      lines.append(f"add element inet proxy {name} {{")
                      lines.append("  " + ",\n  ".join(map(str, addresses)))
                      lines.append("}")
              lines.append("NFT_RULES")
              return "\n".join(lines) + "\n"

          def generate(tmp):
              ad_text = read_text(fetch(AD_URL, tmp / "ad.txt"))
              gfw_encoded = fetch(GFW_URL, tmp / "gfw.b64").read_bytes()
              try:
                  # 只去除空白，严格检查 Base64；不会忽略错误字符。
                  gfw_text = base64.b64decode(b"".join(gfw_encoded.split()), validate=True).decode("utf-8-sig")
              except (ValueError, UnicodeError) as exc:
                  raise ValueError("GFWList Base64 或 UTF-8 解码失败") from exc

              ad_mos, ad_mihomo = convert_domains(ad_text, ad=True)["proxy"]
              gfw = convert_domains(gfw_text)
              proxy_mos, proxy_mihomo = gfw["proxy"]
              direct_mos, direct_mihomo = gfw["direct"]
              files = {
                  "adblock-plus.txt": require_lines(ad_mos, "adblock-plus.txt"),
                  "proxy-list.txt": require_lines(proxy_mos, "proxy-list.txt"),
                  "direct-gfw.txt": require_lines(direct_mos, "direct-gfw.txt"),
                  "mihomo/ad.list": require_lines(ad_mihomo, "mihomo/ad.list"),
                  "mihomo/proxy.list": require_lines(proxy_mihomo, "mihomo/proxy.list"),
                  "mihomo/direct.list": require_lines(direct_mihomo, "mihomo/direct.list"),
              }

              telegram = read_text(fetch(TG_URL, tmp / "telegram.txt"))
              feeds = {"telegram": checked_networks([
                  line.split("#", 1)[0].strip() for line in telegram.splitlines()
                  if line.split("#", 1)[0].strip()
              ], "telegram")}

              for name in META_NAMES:
                  # 每个 JSON 只下载一次，同时解析 IPv4/IPv6。
                  path = fetch(f"{META_BASE}/{name}.json", tmp / f"{name}.json")
                  feeds[name] = meta_networks(path, name)

              github = json.loads(read_text(fetch(GH_URL, tmp / "github.json", github_api=True)))
              feeds["github"] = checked_networks(github.get("git") if isinstance(github, dict) else None, "github.git")

              private = feeds["private"]
              public = {version: set().union(*(
                  networks[version] for name, networks in feeds.items() if name != "private"
              )) for version in (4, 6)}
              # 单个上游允许只有一种 IP 地址族，但关键汇总集合不能缺失。
              for name, group in (("private", private), ("public", public)):
                  for version in (4, 6):
                      if not group[version]:
                          raise ValueError(f"{name}: IPv{version} 汇总为空，取消发布")

              files.update({
                  "mihomo/cf-cidr.list": mihomo_cidrs(feeds["cloudflare"], "mihomo/cf-cidr.list"),
                  "mihomo/github-cidr.list": mihomo_cidrs(feeds["github"], "mihomo/github-cidr.list"),
                  "nft-base-ips4.sh": nft_script(private, public, ipv6=False),
                  # 与旧文件一致：ips6 版本包含 IPv4 和 IPv6。
                  "nft-base-ips6.sh": nft_script(private, public, ipv6=True),
              })
              if set(files) != set(OUTPUTS):
                  raise RuntimeError("生成文件清单与预期不符")
              return files

          def main():
              # 在工作区同一文件系统内暂存，确保单个文件可原子替换。
              with tempfile.TemporaryDirectory(prefix=".run-all-", dir=".") as folder:
                  tmp = Path(folder)
                  files = generate(tmp)
                  stage = tmp / "output"
                  for name in OUTPUTS:
                      target = stage / name
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_text(files[name], encoding="utf-8", newline="\n")
                      if name.endswith(".sh"):
                          target.chmod(0o755)
                          subprocess.run(["sh", "-n", str(target)], check=True)
                  # 所有下载、解析、非空及语法校验成功后再更新工作区。
                  for name in OUTPUTS:
                      target = Path(name)
                      target.parent.mkdir(parents=True, exist_ok=True)
                      os.replace(stage / name, target)
              print("全部 10 个规则文件生成成功。", flush=True)

          try:
              main()
          except (OSError, ValueError, RuntimeError, subprocess.CalledProcessError) as exc:
              raise SystemExit(f"规则更新失败: {exc}") from None
          PY

      - name: 一次提交全部规则并推送
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          git add -- \
            adblock-plus.txt proxy-list.txt direct-gfw.txt \
            mihomo/ad.list mihomo/proxy.list mihomo/direct.list \
            mihomo/cf-cidr.list mihomo/github-cidr.list \
            nft-base-ips4.sh nft-base-ips6.sh

          if git diff --cached --quiet; then
            echo "规则没有变化，无需提交。"
            exit 0
          fi

          git commit -m 'chore: 自动同步 MosDNS、Mihomo 与 nftables 规则'

          # 非强制推送。发生竞争时获取最新远程提交并 rebase；
          # 若发生真实内容冲突，清理 rebase 状态并停止，不覆盖其他提交。
          for attempt in 1 2 3 4 5; do
            echo "推送尝试 ${attempt}/5"
            if git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"; then
              exit 0
            fi

            if [ "$attempt" -eq 5 ]; then
              break
            fi
            sleep "$((attempt * 3))"

            if ! git fetch --no-tags origin "refs/heads/${GITHUB_REF_NAME}"; then
              echo "获取远程分支失败，将重试推送。" >&2
              continue
            fi

            if ! git rebase FETCH_HEAD; then
              git rebase --abort || true
              echo "::error::Git rebase 失败，请检查远程分支冲突；未强制推送。"
              exit 1
            fi
          done

          echo "::error::5 次 Git push 尝试均失败，请检查权限、分支保护及网络。"
          exit 1
