name: Delete old workflow runs

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: delete-old-workflow-runs
  cancel-in-progress: false

jobs:
  del_runs:
    runs-on: ubuntu-latest

    steps:
      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@v2.1.0
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: '7'
          keep_minimum_runs: '6'
          use_daily_retention: 'false'
          dry_run: 'false'
